<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuestLog</title>
<link rel="stylesheet" href="/static/style.css">
<script>
  // Применяем сохранённую тему до отрисовки, чтобы не было мигания темы по умолчанию.
  (function () {
    try {
      document.documentElement.setAttribute("data-theme", "retro");
    } catch (e) {}
  })();
</script>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="logo-mark" data-icon="logo"></span>
    <select id="board-select" class="board-select"></select>
    <button id="new-board-btn" class="icon-btn" title="Новая доска">+ доска</button>
  </div>
  <div class="topbar-center">
    <input id="search-input" type="text" placeholder="Поиск по задачам…  ( / )" class="search-input">
  </div>
  <div class="topbar-right">
    <button id="calendar-toggle-btn" class="icon-btn" title="Календарь"><span data-icon="calendar"></span></button>
    <button id="new-task-btn" class="btn-primary" title="Новая задача (N)">+ Задача</button>
  </div>
</header>

<main id="board" class="board"></main>

<!-- Sliding calendar panel -->
<div id="calendar-overlay" class="calendar-overlay hidden"></div>
<aside id="calendar-panel" class="calendar-panel">
  <div class="calendar-panel-header">
    <h3>Календарь</h3>
    <button id="calendar-close-btn" class="modal-close" title="Скрыть"><span data-icon="close"></span></button>
  </div>
  <div class="calendar-panel-body">
    <div class="calendar-month-nav">
      <button id="calendar-prev-month" class="icon-btn" title="Предыдущий месяц"><span data-icon="chevronLeft"></span></button>
      <span id="calendar-month-label" class="calendar-month-label"></span>
      <button id="calendar-next-month" class="icon-btn" title="Следующий месяц"><span data-icon="chevronRight"></span></button>
    </div>
    <div id="calendar-grid" class="calendar-grid"></div>
    <div class="calendar-day-tasks">
      <h4 id="calendar-day-heading">Задачи на день</h4>
      <div id="calendar-day-list" class="calendar-day-list"></div>
    </div>
  </div>
</aside>

<footer class="footer-bar">
  <span class="footer-brand">QuestLog</span>
  <div class="footer-right">
    <button id="my-tasks-btn" class="icon-btn" title="Показать только мои задачи (Alt+M)">Мои задачи</button>
    <label class="identity-field" title="От чьего имени вы работаете — влияет на «Мои задачи» и автора новых комментариев">
      Я:
      <select id="current-user-select"></select>
    </label>
    <button id="manage-people-btn" class="icon-btn" title="Участники">Участники</button>
    <!-- Вторая тема ещё не добавлена — селектор заблокирован, чтобы не сбивать тему -->
    <select id="theme-select" class="theme-select" title="Тема оформления (пока доступна только одна)" disabled>
      <option value="retro" data-icon-text="theme">Ретро</option>
    </select>
  </div>
</footer>

<!-- Task detail modal -->
<div id="task-modal" class="modal-overlay hidden">
  <div class="modal task-modal" role="dialog" aria-modal="true" aria-labelledby="tm-heading">
    <div class="modal-header">
      <h3 id="tm-heading">Задача</h3>
      <button class="modal-close" data-close title="Закрыть"><span data-icon="close"></span></button>
    </div>
    <div class="modal-body">
      <input id="tm-title" class="tm-title-input" placeholder="Название задачи" autocomplete="off">

      <div class="tm-meta-grid">
        <label class="tm-field">
          <span>Статус</span>
          <select id="tm-column"></select>
        </label>
        <label class="tm-field">
          <span>Приоритет</span>
          <select id="tm-priority">
            <option value="high" data-icon-text="priorityHigh">Высокий</option>
            <option value="medium" data-icon-text="priorityMedium">Средний</option>
            <option value="normal" data-icon-text="priorityNormal">Обычный</option>
            <option value="low" data-icon-text="priorityLow">Низкий</option>
          </select>
        </label>
        <label class="tm-field">
          <span>Исполнитель</span>
          <select id="tm-assignee"></select>
        </label>
        <label class="tm-field">
          <span>Срок</span>
          <input id="tm-due" type="date" autocomplete="off">
        </label>
        <label class="tm-field" style="grid-column: 1 / -1;">
          <span>Теги</span>
          <input id="tm-tags" placeholder="через запятую" autocomplete="off">
        </label>
      </div>
      <div id="tm-tag-presets" class="tag-preset-row"></div>

      <label class="tm-field tm-desc-field">
        <span>Описание</span>
        <textarea id="tm-description" rows="4" placeholder="Подробности задачи…"></textarea>
      </label>

      <section class="tm-section">
        <div class="tm-section-head">
          <h3>Время</h3>
          <span id="tm-time-total" class="time-total"></span>
        </div>
        <div class="timer-bar">
          <button id="tm-timer-toggle" class="btn-primary timer-toggle-btn" type="button">▶ Старт</button>
          <span id="tm-timer-display" class="timer-display">0с</span>
          <span id="tm-timer-note" class="timer-note"></span>
        </div>
        <div id="tm-time-log" class="time-log"></div>
      </section>

      <section class="tm-section">
        <div class="tm-section-head">
          <h3>Подзадачи</h3>
          <span id="tm-subtasks-progress" class="subtasks-progress"></span>
        </div>
        <div id="tm-subtasks" class="subtask-list"></div>
        <div class="subtask-composer">
          <input id="tm-subtask-input" placeholder="Новая подзадача…" autocomplete="off">
          <button id="tm-subtask-add" class="btn-secondary">+ добавить</button>
        </div>
      </section>

      <section class="tm-section">
        <h3>Вложения</h3>
        <div id="tm-attachments" class="attachment-list"></div>
        <label class="upload-btn">
          + прикрепить файл
          <input id="tm-file-input" type="file" hidden>
        </label>
      </section>

      <section class="tm-section">
        <h3>Комментарии</h3>
        <div id="tm-comments" class="comment-list"></div>
        <div class="comment-composer">
          <select id="tm-comment-author"></select>
          <textarea id="tm-comment-text" rows="2" placeholder="Написать комментарий…" autocomplete="off"></textarea>
          <button id="tm-comment-submit" class="btn-primary">Отправить</button>
        </div>
      </section>
    </div>
    <div class="modal-footer">
      <button id="tm-delete" class="btn-danger" title="Удалить задачу"><span data-icon="trash"></span> Удалить</button>
      <div class="footer-actions">
        <span id="tm-saved-hint" class="saved-hint"></span>
        <button class="btn-secondary" data-close>Закрыть</button>
        <button id="tm-save-btn" class="btn-primary">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<!-- People management modal -->
<div id="people-modal" class="modal-overlay hidden">
  <div class="modal people-modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3>Участники</h3>
      <button class="modal-close" data-close title="Закрыть"><span data-icon="close"></span></button>
    </div>
    <div class="modal-body">
      <div id="people-list" class="people-list"></div>
      <div class="add-person-row">
        <input id="new-person-name" placeholder="Имя нового участника" autocomplete="off">
        <button id="add-person-btn" class="btn-primary">Добавить</button>
      </div>
      <p class="hint-text">Добавляйте коллег, чтобы назначать им задачи и видеть их комментарии — доска сразу готова к командной работе.</p>
    </div>
  </div>
</div>

<!-- New board modal -->
<div id="board-modal" class="modal-overlay hidden">
  <div class="modal small-modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3>Новая доска</h3>
      <button class="modal-close" data-close title="Закрыть"><span data-icon="close"></span></button>
    </div>
    <div class="modal-body">
      <input id="new-board-name" placeholder="Название доски" autocomplete="off">
    </div>
    <div class="modal-footer">
      <span></span>
      <div class="footer-actions">
        <button class="btn-secondary" data-close>Отмена</button>
        <button id="create-board-btn" class="btn-primary">Создать</button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm dialog -->
<div id="confirm-modal" class="modal-overlay hidden">
  <div class="modal confirm-modal" role="alertdialog" aria-modal="true">
    <div class="modal-header">
      <h3 id="confirm-title">Подтверждение</h3>
      <button class="modal-close" data-close title="Закрыть"><span data-icon="close"></span></button>
    </div>
    <div class="modal-body">
      <p id="confirm-text"></p>
    </div>
    <div class="modal-footer">
      <span></span>
      <div class="footer-actions">
        <button id="confirm-cancel" class="btn-secondary">Отмена</button>
        <button id="confirm-ok" class="btn-danger">Удалить</button>
      </div>
    </div>
  </div>
</div>

<!-- Attachment preview lightbox -->
<div id="attachment-lightbox" class="lightbox-overlay hidden">
  <div class="lightbox-content">
    <button class="lightbox-close" id="lightbox-close" title="Закрыть"></button>
    <img id="lightbox-image" src="" alt="Превью">
  </div>
</div>

<!-- Task context menu (ПКМ по карточке) -->
<div id="task-context-menu" class="context-menu hidden">
 <button class="context-menu-item" data-action="open">Открыть</button>
 <div class="context-menu-sep"></div>
 <label class="context-menu-field">
    <span class="cm-label">Приоритет</span>
    <select id="cm-priority">
      <option value="high">Высокий</option>
      <option value="medium">Средний</option>
      <option value="normal">Обычный</option>
      <option value="low">Низкий</option>
    </select>
 </label>
 <label class="context-menu-field">
    <span class="cm-label">Исполнитель</span>
    <select id="cm-assignee"></select>
 </label>
 <label class="context-menu-field">
    <span class="cm-label">Срок</span>
    <input id="cm-due" type="date">
 </label>
 <label class="context-menu-field">
    <span class="cm-label">Статус</span>
    <select id="cm-column"></select>
 </label>
 <div class="context-menu-sep"></div>
 <button class="context-menu-item" data-action="subtask">Подзадача</button>
 <div class="context-menu-subtask hidden" id="cm-subtask-form">
    <input id="cm-subtask-input" placeholder="Название подзадачи…" autocomplete="off">
    <button class="btn-primary" id="cm-subtask-add">Добавить</button>
 </div>
 <button class="context-menu-item" data-action="copy">Копировать название</button>
 <div class="context-menu-sep"></div>
 <button class="context-menu-item danger" data-action="delete">Удалить задачу</button>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="/static/js/ui/main.js"></script>
</body>
</html>
